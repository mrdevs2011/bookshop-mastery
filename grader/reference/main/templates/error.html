<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xato — BookShop BOMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f7f3ee;
            background-image:
                radial-gradient(ellipse 90% 50% at 50% -15%, rgba(230, 57, 70, 0.08), transparent 55%),
                linear-gradient(180deg, #faf7f3 0%, #f0ebe4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #2c2c2c;
        }

        .header {
            background: #1a1a1a;
            padding: 0 24px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        .logo span.red { color: #e63946; }
        .logo span.orange {
            color: #f4a261;
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
        }

        .nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .main-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px 72px;
        }

        .error-box {
            background: #fff;
            border-radius: 20px;
            padding: 52px 44px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 700;
            color: #e63946;
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .error-msg {
            font-size: 15px;
            color: #777;
            line-height: 1.55;
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            padding: 13px 28px;
            background: #e63946;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 10px rgba(230, 57, 70, 0.3);
        }

        .btn-home:hover {
            background: #d62839;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.4);
        }

        .footer {
            text-align: center;
            padding: 24px;
            color: #aaa;
            font-size: 12px;
            border-top: 1px solid #e5dfd6;
        }

        @media (max-width: 520px) {
            .error-box { padding: 36px 24px; }
            .error-code { font-size: 56px; }
            .error-title { font-size: 22px; }
        }

    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/book-list/" class="logo">
                <span class="red">Book</span>Shop
                <span class="orange">BOMBA</span>
            </a>
            <nav class="nav">
                <a href="/book-list/">← Katalog</a>
            </nav>
        </div>
    </header>

    <div class="main-wrap">
        <div class="error-box">
            <div class="error-code">XATO</div>
            <h1 class="error-title">Nimadir noto‘g‘ri ketdi</h1>
            <p class="error-msg">
                Sahifa topilmadi yoki ruxsat yo‘q.
            </p>
            <a href="/book-list/" class="btn-home">Katalogga qaytish</a>
        </div>
    </div>

    <footer class="footer">
        © 2026 BookShop BOMBA
    </footer>
</body>
</html>
