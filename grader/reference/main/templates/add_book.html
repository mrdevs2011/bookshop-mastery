<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi kitob qo‘shish — BookShop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f7f3ee;
            background-image:
                radial-gradient(ellipse 90% 50% at 50% -15%, rgba(230, 57, 70, 0.08), transparent 55%),
                linear-gradient(180deg, #faf7f3 0%, #f0ebe4 100%);
            min-height: 100vh;
            color: #2c2c2c;
        }

        .header {
            background: #1a1a1a;
            padding: 0 24px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        .logo span.red { color: #e63946; }
        .logo span.orange {
            color: #f4a261;
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
        }

        .nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .main {
            max-width: 500px;
            margin: 56px auto;
            padding: 0 24px 72px;
        }

        .form-card {
            background: #fff;
            border-radius: 18px;
            padding: 40px 36px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.03);
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #1a1a1a;
        }

        .form-subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #e5dfd6;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background: #faf8f5;
            color: #1a1a1a;
            transition: all 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #e63946;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.12);
        }

        input[type="text"]::placeholder { color: #bbb; }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e63946;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            box-shadow: 0 2px 10px rgba(230, 57, 70, 0.3);
        }

        .btn-submit:hover {
            background: #d62839;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #999;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .back-link:hover { color: #e63946; }

    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/book-list/" class="logo">
                <span class="red">Book</span>Shop
                <span class="orange">BOMBA</span>
            </a>
            <nav class="nav">
                <a href="/book-list/">← Katalogga qaytish</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="form-card">
            <h1 class="form-title">Yangi kitob</h1>
            <p class="form-subtitle">Katalogga yangi kitob qo‘shing</p>

            <form action="/add-book/" method="post">
                <div class="form-group">
                    <label for="name">Kitob nomi</label>
                    <input type="text" id="name" name="name" placeholder="Masalan: O‘tkan kunlar" required>
                </div>

                  <div class="form-group">
                    <label for="url">Kitob URL manzili</label>
                    <input type="text" id="url" name="url" placeholder="Masalan: https://ziyouz.uz/kutubxona/..." required>
                  </div>

                  <div class="form-group">
                    <label for="public">Hammaga ko'rinsinmi?</label>
                    <input type="checkbox" name="public">
                  </div>

                <button type="submit" class="btn-submit">Kitobni saqlash</button>
            </form>

            <a href="/book-list/" class="back-link">← Barcha kitoblarni ko‘rish</a>
        </div>
    </main>
</body>
</html>
