<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro‘yxatdan o‘tish — BookShop BOMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f7f3ee;
            background-image:
                radial-gradient(ellipse 90% 55% at 50% -10%, rgba(230, 57, 70, 0.1), transparent 50%),
                linear-gradient(180deg, #faf7f3 0%, #f0ebe4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c2c2c;
            padding: 20px;
        }

        .auth-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            padding: 44px 36px;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .logo span { color: #e63946; }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #e5dfd6;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background: #faf8f5;
            color: #1a1a1a;
        }

        input:focus {
            outline: none;
            border-color: #e63946;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.12);
        }

        input::placeholder { color: #bbb; }

        .btn {
            background: #e63946;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 6px;
            box-shadow: 0 2px 10px rgba(230, 57, 70, 0.3);
        }

        .btn:hover {
            background: #d62839;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.4);
        }

        .switch-link {
            margin-top: 24px;
            font-size: 13px;
            color: #888;
        }

        .switch-link a {
            color: #e63946;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link a:hover { text-decoration: underline; }

        .messages {
            list-style: none;
            margin-top: 14px;
        }

        .messages .error {
            background: #fef2f2;
            color: #b91c1c;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #fecaca;
        }

    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo">BookShop <span>BOMBA</span></div>
        <p class="subtitle">Yangi hisob yarating</p>

        <form action="/signup/" method="POST">
            <input type="text" name="username" placeholder="Foydalanuvchi nomi" required>
            <input type="password" name="password" placeholder="Parol" required>
            <input type="password" name="password_confirm_ui" placeholder="Parolni tasdiqlang" required>
            <button type="submit" class="btn">Ro‘yxatdan o‘tish</button>
        </form>


        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <p class="switch-link">Hisobingiz bormi? <a href="/login/">Kirish</a></p>
    </div>
</body>
</html>
