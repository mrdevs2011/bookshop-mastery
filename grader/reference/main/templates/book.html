<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{book.name}} — BookShop BOMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f7f3ee;
            background-image:
                radial-gradient(ellipse 90% 50% at 50% -15%, rgba(230, 57, 70, 0.08), transparent 55%),
                linear-gradient(180deg, #faf7f3 0%, #f0ebe4 100%);
            min-height: 100vh;
            color: #2c2c2c;
        }

        .header {
            background: #1a1a1a;
            padding: 0 24px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 68px;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
        }

        .logo span.red { color: #e63946; }
        .logo span.orange {
            color: #f4a261;
            font-size: 14px;
            font-weight: 500;
            margin-left: 10px;
        }

        .nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .main {
            max-width: 900px;
            margin: 48px auto;
            padding: 0 24px 72px;
        }

        .detail-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
            display: flex;
            flex-wrap: wrap;
        }

        .detail-cover {
            width: 270px;
            min-height: 380px;
            background: linear-gradient(155deg, #fffaf5 0%, #f5ebe0 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 28px;
            border-right: 1px solid #eee;
        }

        .detail-cover::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: linear-gradient(90deg, #e63946, #f4a261);
            border-radius: 2px;
        }

        .detail-id {
            font-size: 12px;
            font-weight: 600;
            color: #e63946;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .detail-title-cover {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            color: #1a1a1a;
            margin-bottom: 14px;
        }

        .detail-author-cover {
            font-size: 14px;
            color: #8b5a2b;
            font-style: italic;
        }

        .detail-info {
            flex: 1;
            padding: 44px 40px;
            min-width: 260px;
        }

        .detail-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #999;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 17px;
            color: #333;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .detail-value.title {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            font-weight: 700;
            line-height: 1.25;
            color: #1a1a1a;
        }

        .detail-value a {
            color: deepskyblue;
            text-decoration: none;
            transition: color 0.2s;
        }

        .detail-value a:hover { color: #c45d3e; border-color: #c45d3e; }

        .back-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background: #1a1a1a;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #e63946;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.3);
        }

        @media (max-width: 700px) {
            .detail-cover {
                width: 100%;
                min-height: 240px;
                border-right: none;
                border-bottom: 1px solid #eee;
            }
        }

    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/book-list/" class="logo">
                <span class="red">Book</span>Shop
                <span class="orange"> {{book.user.username}}</span>
            </a>
            <nav class="nav">
                <a href="/book-list/">← Katalog</a>
                <a href="/add-book/">+ Yangi kitob</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="detail-card">
            <div class="detail-cover">
                <div class="detail-id">#{{book.id}}</div>
                <div class="detail-title-cover">{{book.name}}</div>
                <div class="detail-author-cover">{{book.user.username }}</div>
            </div>
            <div class="detail-info">
                <div class="detail-label">Kitob nomi</div>
                <div class="detail-value title">{{book.name}}</div>

                <div class="detail-label">Muallif</div>
                <div class="detail-value">{{book.user.username}}</div>

                <div class="detail-label">URL</div>
                <div class="detail-value"><a href="https://{{book.url}}" target="_blank">Kitob Manzili</a></div>

                <div class="detail-label">Yaratilgan sanasi</div>
                <div class="detail-value">{{book.yaratilgan_sanasi}}</div>

                <div class="detail-label">Ko'rganlar soni</div>
                <div class="detail-value">{{ soni }}</div>

                <a href="/book-list/" class="back-btn">← Katalogga qaytish</a>
            </div>
        </div>
    </main>
</body>
</html>
